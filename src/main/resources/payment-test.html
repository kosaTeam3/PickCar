<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 테스트</title>
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
</head>
<body>
<h2>결제 테스트</h2>
<input type="text" id="merchantUid" placeholder="merchantUid 입력 (Step1 값)">
<input type="number" id="amount" placeholder="결제 금액 (Step1 값)" value="100">
<button onclick="requestPay()">결제하기</button>

<script>
    var IMP = window.IMP;
    IMP.init("imp00000000"); // 본인의 포트원 가맹점 식별코드 입력 (포트원 관리자 콘솔에서 확인)

    function requestPay() {
        var merchantUid = document.getElementById('merchantUid').value;
        var amount = document.getElementById('amount').value;

        IMP.request_pay({
            pg: "html5_inicis", // 테스트 모드 설정 필요
            pay_method: "card",
            merchant_uid: merchantUid,
            name: "테스트 렌트 결제",
            amount: amount,
            buyer_email: "test@pickcar.com",
            buyer_name: "테스터",
            buyer_tel: "010-1234-5678"
        }, function (rsp) {
            if (rsp.success) {
                alert("결제 성공! 이 값을 복사해서 Postman Step3에 쓰세요.\n\nimp_uid: " + rsp.imp_uid);
                console.log(rsp.imp_uid);
            } else {
                alert("결제 실패: " + rsp.error_msg);
            }
        });
    }
</script>
</body>
</html>
