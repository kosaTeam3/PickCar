<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PickCar - 렌트 시간 선택</title>
</head>
<body>
<div>
    <header>
        <div>
            <strong>환영합니다 홍길동님</strong>
        </div>
        <nav>
            <a href="#">[→ 로그아웃</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>렌트 시간 선택</h2>
            <p>차량을 이용할 시간을 선택해주세요</p>
        </section>

        <form id="rentForm" th:action="@{/rent/branches}" method="get">
            <section>
                <article>
                    <label for="startRentDateTime">📅 렌트 시작 시각 <span style="color:red">*</span></label>
                    <input type="datetime-local" id="startRentDateTime" name="startRentDateTime" required>
                </article>
                <article>
                    <label for="endRentDateTime">🕒 렌트 종료 시각</label>
                    <input type="datetime-local" id="endRentDateTime" name="endRentDateTime">
                </article>
            </section>

            <aside>
                <span>💡</span>
                <strong>알림:</strong> 종료 시간을 선택하지 않으면 1일 단위로 자동 계산됩니다.
            </aside>

            <input type="hidden" id="userLatitude" name="userLatitude">
            <input type="hidden" id="userLongitude" name="userLongitude">

            <footer>
                <button type="submit" id="nextBtn" disabled>다음 단계</button>
            </footer>
        </form>
    </main>
</div>

<script>
    // 위치 정보 획득 로직
    window.onload = function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(success, error);
        }
    };

    function success(position) {
        document.getElementById('userLatitude').value = position.coords.latitude;
        document.getElementById('userLongitude').value = position.coords.longitude;
        document.getElementById('nextBtn').disabled = false;
    }

    function error() {
        document.getElementById('userLatitude').value = 37.5665;
        document.getElementById('userLongitude').value = 126.9780;
        document.getElementById('nextBtn').disabled = false;
    }

    document.getElementById('rentForm').onsubmit = function() {
        let startInput = document.getElementById('startRentDateTime');
        let endInput = document.getElementById('endRentDateTime');

        if (!endInput.value) {
            let startDate = new Date(startInput.value);
            startDate.setDate(startDate.getDate() + 1);
            endInput.value = startDate.toISOString().slice(0, 16);
        }
        return true;
    };
</script>
</body>
</html>
